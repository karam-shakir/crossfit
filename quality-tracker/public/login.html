<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول - متابعة وثائق الجودة</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(160deg,#0b3d3a,#1f4e79) }
  .login { background:#fff; border-radius:16px; padding:32px 28px; width:min(400px,92vw); box-shadow:0 20px 50px rgba(0,0,0,.3) }
  .login h1 { margin:0 0 4px; font-size:20px; color:#0b3d3a } .login p { margin:0 0 18px; color:#6b7280; font-size:13px }
  .err { color:#842029; background:#ffc7ce; padding:8px 10px; border-radius:8px; font-size:13px; margin-top:10px }
  .brand { text-align:center; margin-bottom:14px; color:#0b3d3a; font-weight:bold; font-size:13px }
</style>
</head>
<body>
<form class="login" id="f">
  <div class="brand">جامعة أم القرى · كلية الحاسبات<br>وكالة الكلية للتطوير والجودة</div>
  <h1>نظام متابعة وثائق الجودة</h1>
  <p>سجّل الدخول للمتابعة</p>
  <label>اسم المستخدم <input id="u" autocomplete="username" required autofocus></label>
  <label>كلمة المرور <input id="p" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" style="width:100%;margin-top:8px;padding:10px">دخول</button>
  <div class="err" id="err" hidden></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.hidden = true;
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'فشل الدخول');
    location.href = new URLSearchParams(location.search).get('next') || '/';
  } catch (ex) { err.textContent = ex.message; err.hidden = false; }
});
</script>
</body>
</html>
